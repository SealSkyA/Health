# 壹健康 · 检查报告管理系统
# 前端 SPA 托管 + /api 反代到后端 uvicorn
# 注意：35001 为对外入口端口，可通过 NAT 端口映射暴露
server {
    listen 35001;
    server_name localhost;
    client_max_body_size 20m;

    root /home/3HealthTrends/frontend/dist;
    index index.html;

    # 前端静态资源（Vite 构建，含 hash 文件名 /assets/xx-hash.js|css）
    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 后端 API 反代
    location /api/ {
        proxy_pass http://127.0.0.1:35000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # SPA 回退：前端路由走 history 由 Vue 处理，这里用 hash 模式无碍；兜底返回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}